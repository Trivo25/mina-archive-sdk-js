name: Release

# Triggered by pushing a tag matching `v*`. Builds + tests, then creates a
# GitHub release with auto-generated notes.
#
# NOTE: npm publishing is done manually from a maintainer's laptop, NOT here.
# The @o1-labs npm account is shared and 2FA-protected with TOTP, which is
# incompatible with non-interactive CI. Workflow:
#
#   npm login --scope=@o1-labs --auth-type=legacy
#   npm publish --access public --otp=<TOTP code>
#   git tag v<X.Y.Z> && git push origin v<X.Y.Z>   # this workflow then runs
#
# Keep the version bump + publish + tag in the same maintainer session so
# the tag points at exactly what was published.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --generate-notes
